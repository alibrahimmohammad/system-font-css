<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>نظام إدارة الموظفين</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f0f0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #aaa;
    }
    input, select, button {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    table, th, td {
      border: 1px solid #aaa;
    }
    th, td {
      padding: 8px;
      text-align: center;
    }
    .actions button {
      margin: 2px;
    }
    #msg {
      color: green;
      text-align: right;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>نظام إدارة الموظفين</h2>

  <div id="msg"></div>

  <label>الاسم:</label>
  <input type="text" id="name" />

  <label>الجنس:</label>
  <select id="gender">
    <option>ذكر</option>
    <option>أنثى</option>
  </select>

  <label>المدينة:</label>
  <select id="city">
    <option>أربيل</option>
    <option>دهوك</option>
  </select>

  <label>تاريخ الميلاد:</label>
  <input type="date" id="birthdate" />

  <button onclick="addEmployee()">➕ إضافة موظف</button>
  <button onclick="displayEmployees()">👁️ عرض الموظفين</button>

  <label>🔍 بحث بالاسم:</label>
  <input type="text" id="searchInput" oninput="searchEmployee()" placeholder="اكتب اسم الموظف..." />

  <table id="employeeTable" style="display:none;">
    <thead>
      <tr>
        <th>تسلسل</th>
        <th>الاسم</th>
        <th>الجنس</th>
        <th>المدينة</th>
        <th>تاريخ الميلاد</th>
        <th>تاريخ التسجيل</th>
        <th>الوقت</th>
        <th>عدد الأيام</th>
        <th>إجراءات</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
let employees = JSON.parse(localStorage.getItem("employees") || "[]");

function showMessage(text) {
  const msg = document.getElementById("msg");
  msg.innerText = text;
  msg.style.display = "block";
  setTimeout(() => msg.style.display = "none", 3000);
}

function addEmployee() {
  const name = document.getElementById("name").value.trim();
  const gender = document.getElementById("gender").value;
  const city = document.getElementById("city").value;
  const birthdate = document.getElementById("birthdate").value;

  if (!name || !birthdate) {
    alert("يرجى إدخال جميع البيانات.");
    return;
  }

  const now = new Date();
  const registerDate = now.toLocaleDateString('ar-EG');
  const time = now.toLocaleTimeString('ar-EG');
  const birth = new Date(birthdate);
  const ageDays = Math.floor((now - birth) / (1000 * 60 * 60 * 24));
  const serial = employees.length + 1;

  const employee = { serial, name, gender, city, birthdate, registerDate, time, ageDays };
  employees.push(employee);
  localStorage.setItem("employees", JSON.stringify(employees));

  showMessage("✅ تم تسجيل الموظف بنجاح");
  clearForm();
  displayEmployees();
}

function displayEmployees() {
  const table = document.getElementById("employeeTable");
  const tbody = table.querySelector("tbody");
  tbody.innerHTML = "";
  employees.forEach((emp, index) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${emp.serial}</td>
      <td>${emp.name}</td>
      <td>${emp.gender}</td>
      <td>${emp.city}</td>
      <td>${emp.birthdate}</td>
      <td>${emp.registerDate}</td>
      <td>${emp.time}</td>
      <td>${emp.ageDays}</td>
      <td class="actions">
        <button onclick="editEmployee(${index})">✏️ تعديل</button>
        <button onclick="deleteEmployee(${index})">🗑️ حذف</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
  table.style.display = "table";
}

function clearForm() {
  document.getElementById("name").value = "";
  document.getElementById("birthdate").value = "";
}

function deleteEmployee(index) {
  const emp = employees[index];
  if (confirm(`هل تريد حذف ${emp.name}؟`)) {
    employees.splice(index, 1);
    localStorage.setItem("employees", JSON.stringify(employees));
    displayEmployees();
    showMessage("🗑️ تم حذف الموظف");
  }
}

function editEmployee(index) {
  const emp = employees[index];
  const name = prompt("تعديل الاسم:", emp.name);
  if (name) {
    emp.name = name;
    localStorage.setItem("employees", JSON.stringify(employees));
    displayEmployees();
    showMessage("✏️ تم تعديل الموظف");
  }
}

function searchEmployee() {
  const value = document.getElementById("searchInput").value.trim();
  const rows = document.querySelectorAll("#employeeTable tbody tr");
  rows.forEach(row => {
    const name = row.children[1].textContent;
    row.style.display = name.includes(value) ? "" : "none";
  });
}
</script>

</body>
</html>
